<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Photo Gallery | Rose Public School</title>

    <link rel="stylesheet" href="common.css">
    <link rel="stylesheet" href="Gallery.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>

<body>
    <header class="site-header">
        <nav class="nav-container">

            <a href="index.html" class="logo-wrapper">
                <img src="logo.jpg" alt="Rose Public School Logo" class="site-logo">

                <span class="logo-text">
                    ROSE PUBLIC SCHOOL
                </span>
            </a>

            <button class="menu-btn" id="menuBtn" onclick="toggleMobileMenu(event)" aria-label="Open Menu">
                <i class="fa-solid fa-bars"></i>
            </button>

            <ul class="nav-links">

                <li>
                    <a href="index.html" class="nav-link">
                        <i class="fa-solid fa-house"></i>
                        Home
                    </a>
                </li>

                <li>
                    <a href="About.html" class="nav-link">
                        <i class="fa-solid fa-school"></i>
                        About Us
                    </a>
                </li>

                <li>
                    <a href="Admission.html" class="nav-link">
                        <i class="fa-solid fa-file-signature"></i>
                        Admission
                    </a>
                </li>

                <li>
                    <a href="Acadmics.html" class="nav-link">
                        <i class="fa-solid fa-book-open"></i>
                        Academics
                    </a>
                </li>

                <li>
                    <a href="Faculty.html" class="nav-link">
                        <i class="fa-solid fa-chalkboard-user"></i>
                        Faculty
                    </a>
                </li>

                <li>
                    <a href="Gallery.html" class="nav-link active">
                        <i class="fa-solid fa-images"></i>
                        Gallery
                    </a>
                </li>

                <li>
                    <a href="Facilities.html" class="nav-link">
                        <i class="fa-solid fa-building"></i>
                        Facilities
                    </a>
                </li>

                <li>
                    <a href="Contact.html" class="nav-link">
                        <i class="fa-solid fa-phone"></i>
                        Contact
                    </a>
                </li>
                <li class="mobile-apply">
                    <a href="Admission.html" class="nav-link">
                        <i class="fa-solid fa-arrow-right-to-bracket"></i>
                        Apply Now
                    </a>
                </li>

            </ul>

            <div class="nav-right">
                <a href="Admission.html" class="apply-btn">
                    Apply Now
                </a>
            </div>

        </nav>
    </header>
    <div class="menu-overlay" id="menuOverlay"></div>
    <section class="gallery-hero">
        <div class="hero-content">
            <h1>Photo Gallery</h1>
            <p>Take a glimpse into the vibrant life, events, and activities at Rose Public School.</p>
        </div>
    </section>

    <section class="gallery-section">
        <div class="container">

            <div class="filter-buttons">
                <button type="button" class="filter-btn active" onclick="applyFilter(this, 'all')">All</button>
                <button type="button" class="filter-btn" onclick="applyFilter(this, 'events')">Events</button>
                <button type="button" class="filter-btn" onclick="applyFilter(this, 'sports')">Sports</button>
                <button type="button" class="filter-btn" onclick="applyFilter(this, 'classroom')">Classroom</button>
                <button type="button" class="filter-btn" onclick="applyFilter(this, 'library')">Library</button>
                <button type="button" class="filter-btn" onclick="applyFilter(this, 'music')">Music</button>
                <button type="button" class="filter-btn" onclick="applyFilter(this, 'outdoors')">Outdoors</button>
            </div>

            <div class="gallery-grid">

                <div class="gallery-card events">
                    <img src="image/discuss.jpg" alt="Events Image 1">
                </div>
                <div class="gallery-card events">
                    <img src="image/science5.jpg" alt="Events Image 2">
                </div>

                <div class="gallery-card sports">
                    <img src="image/pet.jpg" alt="Sports Image 1">
                </div>
                <div class="gallery-card sports">
                    <img src="image/science4.jpg" alt="Sports Image 2">
                </div>

                <div class="gallery-card classroom">
                    <img src="image/lab (1).jpg" alt="Classroom Image">
                </div>

                <div class="gallery-card library">
                    <img src="image/library.jpg" alt="Library Image 1">
                </div>
                <div class="gallery-card library">
                    <img src="image/library3.jpg" alt="Library Image 2">
                </div>

                <div class="gallery-card music">
                    <img src="image/extraCirculum.jpg" alt="Music Room Image">
                </div>

                <div class="gallery-card outdoors">
                    <img src="image/feculty.jpg" alt="Outdoors Activity Image">
                </div>

            </div>
        </div>
    </section>

    <footer class="site-footer">
        <p>© 2026 Rose Public School. All Rights Reserved.</p>
    </footer>
    <script src="Script.js"></script>
</body>

</html>
